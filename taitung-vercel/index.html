<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>台東熱門農產品行情看板</title>
  <link rel="stylesheet" href="./style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="header-banner"><div class="container hero-content">
    <div><p class="eyebrow">TAITUNG AGRICULTURE DASHBOARD</p><h1>台東熱門農產品行情看板</h1><p>本週行情走勢與零售價預估（資料自動更新中）</p></div>
    <div class="update-badge" id="updated-at">最後更新時間：載入中</div>
  </div></header>
  <main class="container">
    <div class="notice"><strong>溫馨提示：</strong>農業部市場交易資料通常於 10～12 點期間更新。若今日資料尚未發布，系統會顯示最新可用日期。</div>
    <section class="crop-selector card"><h2>請選擇農產品</h2><div class="crop-buttons" id="crop-buttons"></div></section>
    <div class="status-message" id="status-message">資料載入中…</div>
    <section class="chart-card card"><h2>▥ 批發價 vs 估算零售價</h2><div class="chart-wrap"><canvas id="bar-chart"></canvas></div></section>
    <section class="chart-card card"><h2>⌁ 本週價格起伏走勢</h2><div class="chart-wrap"><canvas id="line-chart"></canvas></div></section>
    <section class="table-card card"><h2>價格明細</h2><div class="table-wrap"><table><thead><tr><th>日期</th><th>批發價</th><th>估算零售價</th><th>價差</th><th>資料來源</th></tr></thead><tbody id="price-table"></tbody></table></div></section>
    <p class="error" id="error-message" hidden></p>
  </main>
  <footer>台東農產品行情看板｜資料來源：農業部農產品交易行情</footer>
  <script src="./app.js" defer></script>
</body>
</html>
